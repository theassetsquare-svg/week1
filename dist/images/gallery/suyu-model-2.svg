<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bgG2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2a"/>
      <stop offset="50%" style="stop-color:#1b2838"/>
      <stop offset="100%" style="stop-color:#0a0f1a"/>
    </linearGradient>
    <radialGradient id="neon1" cx="20%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#ff00ff;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#ff00ff;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="neon2" cx="80%" cy="50%" r="45%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#00e5ff;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="neon3" cx="50%" cy="25%" r="35%">
      <stop offset="0%" style="stop-color:#ffab00;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#ffab00;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="hair2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c1810"/>
      <stop offset="100%" style="stop-color:#1a0e08"/>
    </linearGradient>
    <linearGradient id="dress2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c4dff"/>
      <stop offset="50%" style="stop-color:#651fff"/>
      <stop offset="100%" style="stop-color:#4a148c"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe0c2"/>
      <stop offset="100%" style="stop-color:#f5caa8"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgG2)"/>
  <rect width="800" height="800" fill="url(#neon1)"/>
  <rect width="800" height="800" fill="url(#neon2)"/>
  <rect width="800" height="800" fill="url(#neon3)"/>

  <!-- Dance floor lights -->
  <rect x="0" y="680" width="160" height="120" fill="#ff00ff" opacity="0.06"/>
  <rect x="160" y="680" width="160" height="120" fill="#00e5ff" opacity="0.06"/>
  <rect x="320" y="680" width="160" height="120" fill="#ffab00" opacity="0.06"/>
  <rect x="480" y="680" width="160" height="120" fill="#ff00ff" opacity="0.06"/>
  <rect x="640" y="680" width="160" height="120" fill="#00e5ff" opacity="0.06"/>

  <!-- Disco ball effect -->
  <circle cx="400" cy="60" r="30" fill="#333" stroke="#666" stroke-width="1"/>
  <circle cx="390" cy="52" r="4" fill="#fff" opacity="0.6"/>
  <circle cx="405" cy="55" r="3" fill="#fff" opacity="0.5"/>
  <circle cx="395" cy="68" r="3.5" fill="#fff" opacity="0.4"/>
  <circle cx="410" cy="65" r="3" fill="#fff" opacity="0.5"/>
  <line x1="400" y1="0" x2="400" y2="30" stroke="#555" stroke-width="1"/>

  <!-- Light rays from disco ball -->
  <line x1="400" y1="60" x2="100" y2="400" stroke="#ff69b4" stroke-width="0.5" opacity="0.15"/>
  <line x1="400" y1="60" x2="700" y2="350" stroke="#00e5ff" stroke-width="0.5" opacity="0.15"/>
  <line x1="400" y1="60" x2="200" y2="600" stroke="#ffab00" stroke-width="0.5" opacity="0.1"/>
  <line x1="400" y1="60" x2="600" y2="550" stroke="#7c4dff" stroke-width="0.5" opacity="0.12"/>
  <line x1="400" y1="60" x2="50" y2="250" stroke="#ff1493" stroke-width="0.5" opacity="0.1"/>
  <line x1="400" y1="60" x2="750" y2="200" stroke="#00ffcc" stroke-width="0.5" opacity="0.1"/>

  <!-- Background silhouettes (other people dancing) -->
  <ellipse cx="130" cy="520" rx="35" ry="45" fill="#1a1a2e" opacity="0.6"/>
  <ellipse cx="130" cy="600" rx="40" ry="80" fill="#1a1a2e" opacity="0.6"/>
  <ellipse cx="670" cy="530" rx="30" ry="40" fill="#1a1a2e" opacity="0.5"/>
  <ellipse cx="670" cy="620" rx="38" ry="75" fill="#1a1a2e" opacity="0.5"/>
  <ellipse cx="200" cy="560" rx="25" ry="35" fill="#1a1a2e" opacity="0.4"/>
  <ellipse cx="200" cy="640" rx="30" ry="65" fill="#1a1a2e" opacity="0.4"/>
  <ellipse cx="600" cy="550" rx="28" ry="38" fill="#1a1a2e" opacity="0.4"/>
  <ellipse cx="600" cy="630" rx="32" ry="70" fill="#1a1a2e" opacity="0.4"/>

  <!-- Main figure - Dancing pose, slight tilt -->
  <g transform="translate(400,400) rotate(-5) translate(-400,-400)">

    <!-- Hair (wavy, flowing) -->
    <ellipse cx="400" cy="225" rx="90" ry="100" fill="url(#hair2)"/>
    <path d="M310 230 Q295 320 280 420 Q275 450 295 440 Q300 360 320 270 Z" fill="url(#hair2)"/>
    <path d="M490 225 Q510 310 530 400 Q535 430 515 425 Q505 350 485 260 Z" fill="url(#hair2)"/>
    <!-- Hair highlight -->
    <path d="M350 180 Q380 170 400 175 Q390 185 360 190 Z" fill="#4a3020" opacity="0.5"/>

    <!-- Face -->
    <ellipse cx="400" cy="240" rx="68" ry="80" fill="url(#skin2)"/>

    <!-- Eyes - big bright happy eyes -->
    <ellipse cx="375" cy="230" rx="12" ry="13" fill="#ffffff"/>
    <ellipse cx="425" cy="228" rx="12" ry="13" fill="#ffffff"/>
    <circle cx="377" cy="228" r="7" fill="#2c1810"/>
    <circle cx="427" cy="226" r="7" fill="#2c1810"/>
    <circle cx="375" cy="226" r="3" fill="#000"/>
    <circle cx="425" cy="224" r="3" fill="#000"/>
    <!-- Eye sparkle -->
    <circle cx="379" cy="224" r="2.5" fill="#fff" opacity="0.9"/>
    <circle cx="429" cy="222" r="2.5" fill="#fff" opacity="0.9"/>
    <circle cx="373" cy="230" r="1.5" fill="#fff" opacity="0.5"/>
    <circle cx="423" cy="228" r="1.5" fill="#fff" opacity="0.5"/>

    <!-- Eyelashes -->
    <path d="M362 222 Q360 216 356 214" stroke="#1a0a00" stroke-width="1.5" fill="none"/>
    <path d="M366 219 Q363 213 360 212" stroke="#1a0a00" stroke-width="1.5" fill="none"/>
    <path d="M438 220 Q440 214 444 212" stroke="#1a0a00" stroke-width="1.5" fill="none"/>
    <path d="M434 217 Q437 211 440 210" stroke="#1a0a00" stroke-width="1.5" fill="none"/>

    <!-- Eyebrows (arched, happy) -->
    <path d="M358 210 Q372 200 390 205" stroke="#2c1810" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M410 203 Q428 198 442 208" stroke="#2c1810" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M396 250 Q400 258 405 254" stroke="#e0a88a" stroke-width="1.5" fill="none"/>

    <!-- Big bright smile with teeth -->
    <path d="M370 272 Q385 296 400 298 Q415 296 430 272" stroke="#c0392b" stroke-width="2" fill="#e74c3c"/>
    <path d="M374 274 Q400 290 426 274" fill="#ffffff"/>
    <!-- Lower lip -->
    <path d="M375 274 Q400 305 425 274" fill="#c0392b" opacity="0.3"/>

    <!-- Dimples -->
    <path d="M360 278 Q358 282 360 286" stroke="#e0a88a" stroke-width="1" fill="none" opacity="0.5"/>
    <path d="M440 276 Q442 280 440 284" stroke="#e0a88a" stroke-width="1" fill="none" opacity="0.5"/>

    <!-- Cheek blush -->
    <ellipse cx="355" cy="268" rx="16" ry="10" fill="#ff9a9a" opacity="0.3"/>
    <ellipse cx="445" cy="266" rx="16" ry="10" fill="#ff9a9a" opacity="0.3"/>

    <!-- Neck -->
    <rect x="386" y="312" width="28" height="35" rx="10" fill="url(#skin2)"/>

    <!-- Shoulders -->
    <ellipse cx="348" cy="355" rx="48" ry="18" fill="url(#skin2)"/>
    <ellipse cx="452" cy="352" rx="48" ry="18" fill="url(#skin2)"/>

    <!-- Dress -->
    <path d="M340 350 Q320 400 300 520 Q290 600 310 680 L490 680 Q510 600 500 520 Q480 400 460 350 Z" fill="url(#dress2)"/>
    <!-- Dress sparkles -->
    <circle cx="360" cy="420" r="2" fill="#fff" opacity="0.4"/>
    <circle cx="430" cy="480" r="1.5" fill="#fff" opacity="0.3"/>
    <circle cx="380" cy="550" r="2" fill="#fff" opacity="0.35"/>
    <circle cx="420" cy="600" r="1.5" fill="#fff" opacity="0.3"/>
    <circle cx="350" cy="500" r="1" fill="#fff" opacity="0.25"/>

    <!-- Dress neckline -->
    <path d="M348 350 Q400 380 452 348" stroke="url(#dress2)" stroke-width="2" fill="url(#dress2)"/>

    <!-- Left arm (holding drink, slightly out) -->
    <path d="M300 365 Q270 380 250 420 Q240 445 250 460" stroke="url(#skin2)" stroke-width="26" fill="none" stroke-linecap="round"/>
    <circle cx="250" cy="462" r="14" fill="#ffe0c2"/>

    <!-- Cocktail glass -->
    <path d="M230 430 L250 460 L270 430 Z" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.7"/>
    <line x1="250" y1="460" x2="250" y2="485" stroke="#fff" stroke-width="1.5" opacity="0.7"/>
    <line x1="238" y1="485" x2="262" y2="485" stroke="#fff" stroke-width="1.5" opacity="0.7"/>
    <path d="M233 432 L250 455 L267 432 Z" fill="#ff69b4" opacity="0.4"/>
    <!-- Garnish -->
    <circle cx="260" cy="432" r="5" fill="#ff6b6b" opacity="0.6"/>

    <!-- Right arm (raised, dancing) -->
    <path d="M500 360 Q530 320 545 270 Q550 250 540 240" stroke="url(#skin2)" stroke-width="26" fill="none" stroke-linecap="round"/>
    <circle cx="538" cy="238" r="14" fill="#ffe0c2"/>

    <!-- Bracelet -->
    <circle cx="530" cy="290" r="16" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.6"/>

    <!-- Earrings (dangling) -->
    <line x1="332" y1="258" x2="328" y2="278" stroke="#ffd700" stroke-width="1.5" opacity="0.7"/>
    <circle cx="328" cy="282" r="5" fill="#ff69b4" opacity="0.6"/>
    <line x1="468" y1="255" x2="472" y2="275" stroke="#ffd700" stroke-width="1.5" opacity="0.7"/>
    <circle cx="472" cy="279" r="5" fill="#ff69b4" opacity="0.6"/>

  </g>

  <!-- Floating confetti/sparkles -->
  <text x="300" y="150" font-size="16" fill="#ff69b4" opacity="0.7">✦</text>
  <text x="500" y="180" font-size="20" fill="#00e5ff" opacity="0.6">✧</text>
  <text x="180" y="300" font-size="14" fill="#ffab00" opacity="0.5">✦</text>
  <text x="620" y="280" font-size="18" fill="#ff69b4" opacity="0.5">✧</text>
  <text x="350" y="120" font-size="12" fill="#7c4dff" opacity="0.6">✦</text>
  <text x="550" y="140" font-size="15" fill="#ffd700" opacity="0.5">✦</text>
  <text x="150" y="450" font-size="10" fill="#00e5ff" opacity="0.4">✧</text>
  <text x="650" cy="420" font-size="12" fill="#ff1493" opacity="0.4">✦</text>

  <!-- Floor -->
  <rect x="0" y="700" width="800" height="100" fill="#0a0f1a" opacity="0.9"/>
  <line x1="0" y1="700" x2="800" y2="700" stroke="#7c4dff" stroke-width="1" opacity="0.3"/>

  <!-- Bottom text -->
  <text x="400" y="760" text-anchor="middle" font-family="'Noto Sans KR', sans-serif" font-size="18" fill="#9e88c4" letter-spacing="6" opacity="0.5">SUYU SHAMPOO NIGHT</text>
</svg>
