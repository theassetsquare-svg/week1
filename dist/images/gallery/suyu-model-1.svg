<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bgG1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="50%" style="stop-color:#2d1454"/>
      <stop offset="100%" style="stop-color:#0d0618"/>
    </linearGradient>
    <radialGradient id="spot1" cx="30%" cy="20%" r="40%">
      <stop offset="0%" style="stop-color:#ff69b4;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#ff69b4;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="spot2" cx="70%" cy="30%" r="35%">
      <stop offset="0%" style="stop-color:#7b68ee;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#7b68ee;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="spot3" cx="50%" cy="60%" r="30%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="hair1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <linearGradient id="dress1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e91e63"/>
      <stop offset="50%" style="stop-color:#c2185b"/>
      <stop offset="100%" style="stop-color:#880e4f"/>
    </linearGradient>
    <linearGradient id="skin1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fdd9b5"/>
      <stop offset="100%" style="stop-color:#f5c6a0"/>
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgG1)"/>
  <rect width="800" height="800" fill="url(#spot1)"/>
  <rect width="800" height="800" fill="url(#spot2)"/>
  <rect width="800" height="800" fill="url(#spot3)"/>

  <!-- Disco lights -->
  <circle cx="150" cy="80" r="4" fill="#ff69b4" opacity="0.8" filter="url(#glow1)"/>
  <circle cx="650" cy="120" r="3" fill="#7b68ee" opacity="0.7" filter="url(#glow1)"/>
  <circle cx="400" cy="50" r="5" fill="#00d4ff" opacity="0.6" filter="url(#glow1)"/>
  <circle cx="250" cy="150" r="3" fill="#ffd700" opacity="0.5" filter="url(#glow1)"/>
  <circle cx="550" cy="60" r="4" fill="#ff1493" opacity="0.6" filter="url(#glow1)"/>
  <circle cx="100" cy="200" r="2" fill="#00ffcc" opacity="0.4" filter="url(#glow1)"/>
  <circle cx="700" cy="250" r="3" fill="#ff6b6b" opacity="0.5" filter="url(#glow1)"/>

  <!-- Light beams -->
  <polygon points="400,0 350,300 450,300" fill="#ff69b4" opacity="0.04"/>
  <polygon points="200,0 180,350 280,300" fill="#7b68ee" opacity="0.03"/>
  <polygon points="600,0 550,280 650,320" fill="#00d4ff" opacity="0.03"/>

  <!-- Figure - Hair (long flowing) -->
  <ellipse cx="400" cy="240" rx="95" ry="110" fill="url(#hair1)"/>
  <path d="M305 240 Q290 350 310 480 Q320 500 340 490 Q330 380 340 280 Z" fill="url(#hair1)"/>
  <path d="M495 240 Q510 350 490 480 Q480 500 460 490 Q470 380 460 280 Z" fill="url(#hair1)"/>

  <!-- Face -->
  <ellipse cx="400" cy="255" rx="72" ry="85" fill="url(#skin1)"/>

  <!-- Eyes - happy/laughing (crescents) -->
  <path d="M365 240 Q375 225 390 240" stroke="#2a1a0a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M410 240 Q420 225 435 240" stroke="#2a1a0a" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Eyebrows -->
  <path d="M360 225 Q375 215 392 220" stroke="#1a0a00" stroke-width="2" fill="none"/>
  <path d="M408 220 Q425 215 440 225" stroke="#1a0a00" stroke-width="2" fill="none"/>

  <!-- Nose -->
  <path d="M398 260 Q400 268 404 264" stroke="#e0a88a" stroke-width="1.5" fill="none"/>

  <!-- Big smile -->
  <path d="M368 280 Q400 320 432 280" stroke="#c0392b" stroke-width="2.5" fill="#e74c3c"/>
  <path d="M372 282 Q400 300 428 282" fill="#ffffff" opacity="0.9"/>

  <!-- Cheek blush -->
  <ellipse cx="355" cy="275" rx="18" ry="12" fill="#ff9a9a" opacity="0.35"/>
  <ellipse cx="445" cy="275" rx="18" ry="12" fill="#ff9a9a" opacity="0.35"/>

  <!-- Neck -->
  <rect x="385" y="330" width="30" height="40" rx="10" fill="url(#skin1)"/>

  <!-- Body/Dress -->
  <path d="M350 365 Q340 370 310 520 Q300 580 320 650 L480 650 Q500 580 490 520 Q460 370 450 365 Z" fill="url(#dress1)"/>

  <!-- Shoulders -->
  <ellipse cx="345" cy="370" rx="45" ry="20" fill="url(#skin1)"/>
  <ellipse cx="455" cy="370" rx="45" ry="20" fill="url(#skin1)"/>

  <!-- Dress top/neckline -->
  <path d="M355 365 Q400 395 445 365 Q440 355 400 375 Q360 355 355 365 Z" fill="url(#dress1)"/>

  <!-- Arms raised (celebrating) -->
  <path d="M300 380 Q260 330 240 260 Q235 245 245 240" stroke="url(#skin1)" stroke-width="28" fill="none" stroke-linecap="round"/>
  <path d="M500 380 Q540 330 560 260 Q565 245 555 240" stroke="url(#skin1)" stroke-width="28" fill="none" stroke-linecap="round"/>

  <!-- Hands -->
  <circle cx="243" cy="238" r="16" fill="#fdd9b5"/>
  <circle cx="557" cy="238" r="16" fill="#fdd9b5"/>

  <!-- Sparkles near hands -->
  <text x="210" y="220" font-size="24" fill="#ffd700" opacity="0.8">✦</text>
  <text x="570" y="215" font-size="20" fill="#ff69b4" opacity="0.8">✦</text>
  <text x="260" y="200" font-size="16" fill="#00d4ff" opacity="0.6">✦</text>
  <text x="540" y="195" font-size="18" fill="#ffd700" opacity="0.7">✦</text>

  <!-- Earrings -->
  <circle cx="328" cy="270" r="5" fill="#ffd700" opacity="0.8"/>
  <circle cx="328" cy="282" r="4" fill="#ffd700" opacity="0.6"/>
  <circle cx="472" cy="270" r="5" fill="#ffd700" opacity="0.8"/>
  <circle cx="472" cy="282" r="4" fill="#ffd700" opacity="0.6"/>

  <!-- Necklace -->
  <path d="M365 365 Q400 385 435 365" stroke="#ffd700" stroke-width="1.5" fill="none" opacity="0.7"/>
  <circle cx="400" cy="383" r="4" fill="#ffd700" opacity="0.8"/>

  <!-- Floor reflection -->
  <rect x="0" y="700" width="800" height="100" fill="#0a0412" opacity="0.8"/>
  <line x1="0" y1="700" x2="800" y2="700" stroke="#ff69b4" stroke-width="1" opacity="0.3"/>

  <!-- Bottom text -->
  <text x="400" y="760" text-anchor="middle" font-family="'Noto Sans KR', sans-serif" font-size="18" fill="#b8a0d4" letter-spacing="6" opacity="0.6">SUYU SHAMPOO NIGHT</text>

  <!-- Floating particles -->
  <circle cx="120" cy="400" r="2" fill="#ff69b4" opacity="0.4"/>
  <circle cx="680" cy="350" r="1.5" fill="#7b68ee" opacity="0.5"/>
  <circle cx="200" cy="500" r="1" fill="#ffd700" opacity="0.3"/>
  <circle cx="600" cy="450" r="2" fill="#00d4ff" opacity="0.4"/>
  <circle cx="350" cy="150" r="1.5" fill="#ff1493" opacity="0.3"/>
  <circle cx="500" cy="100" r="1" fill="#ffd700" opacity="0.4"/>
</svg>
