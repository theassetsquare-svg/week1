<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0533;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d1b69;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0a1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d4a54a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f5d778;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4a54a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <circle cx="300" cy="200" r="180" fill="none" stroke="#d4a54a" stroke-width="1" opacity="0.2"/>
  <circle cx="300" cy="200" r="140" fill="none" stroke="#d4a54a" stroke-width="0.5" opacity="0.15"/>
  <line x1="80" y1="310" x2="520" y2="310" stroke="url(#gold)" stroke-width="1.5" opacity="0.6"/>
  <line x1="120" y1="440" x2="480" y2="440" stroke="url(#gold)" stroke-width="1" opacity="0.4"/>
  <text x="300" y="220" text-anchor="middle" font-family="'Noto Sans KR', sans-serif" font-size="72" font-weight="800" fill="url(#gold)" filter="url(#glow)">수유샴푸</text>
  <text x="300" y="290" text-anchor="middle" font-family="'Noto Sans KR', sans-serif" font-size="28" font-weight="400" fill="#b8a0d4" letter-spacing="12">N I G H T</text>
  <text x="300" y="395" text-anchor="middle" font-family="'Noto Sans KR', sans-serif" font-size="56" font-weight="700" fill="#ffffff" filter="url(#glow)">황정민</text>
  <text x="300" y="490" text-anchor="middle" font-family="'Noto Sans KR', sans-serif" font-size="20" font-weight="400" fill="#8a7aa0" letter-spacing="4">PREMIUM NIGHT LIFE</text>
  <rect x="200" y="530" width="200" height="36" rx="18" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.5"/>
  <text x="300" y="554" text-anchor="middle" font-family="'Noto Sans KR', sans-serif" font-size="16" font-weight="500" fill="#d4a54a">SUYU · SEOUL</text>
</svg>
