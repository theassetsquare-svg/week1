<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0533;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d1b69;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d0d2b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6fd8" />
      <stop offset="50%" style="stop-color:#ffbe0b" />
      <stop offset="100%" style="stop-color:#ff6fd8" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- decorative circles -->
  <circle cx="100" cy="80" r="60" fill="#ff6fd8" opacity="0.08"/>
  <circle cx="700" cy="320" r="80" fill="#ffbe0b" opacity="0.06"/>
  <circle cx="400" cy="200" r="150" fill="#7b2ff7" opacity="0.05"/>
  <!-- sparkle dots -->
  <circle cx="150" cy="50" r="2" fill="#fff" opacity="0.6"/>
  <circle cx="650" cy="70" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="300" cy="350" r="2" fill="#fff" opacity="0.4"/>
  <circle cx="550" cy="30" r="1.5" fill="#fff" opacity="0.7"/>
  <circle cx="750" cy="200" r="2" fill="#fff" opacity="0.5"/>
  <circle cx="50" cy="300" r="1.5" fill="#fff" opacity="0.6"/>
  <!-- top label -->
  <text x="400" y="100" text-anchor="middle" font-family="'Noto Sans KR', sans-serif" font-size="28" font-weight="600" fill="#c4a0ff" filter="url(#glow)">수유샴푸 나이트</text>
  <!-- main text 황정민 -->
  <text x="400" y="210" text-anchor="middle" font-family="'Noto Sans KR', sans-serif" font-size="100" font-weight="800" fill="url(#textGlow)" filter="url(#bigGlow)">황정민</text>
  <!-- subtitle -->
  <text x="400" y="280" text-anchor="middle" font-family="'Noto Sans KR', sans-serif" font-size="24" font-weight="500" fill="#ffffff" opacity="0.9">수유 최고의 나이트 경험</text>
  <!-- bottom accent line -->
  <rect x="300" y="310" width="200" height="3" rx="1.5" fill="url(#textGlow)" opacity="0.7"/>
  <!-- bottom badge -->
  <rect x="310" y="330" width="180" height="36" rx="18" fill="#ff6fd8" opacity="0.2" stroke="#ff6fd8" stroke-width="1" stroke-opacity="0.5"/>
  <text x="400" y="355" text-anchor="middle" font-family="'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#ffbe0b">PREMIUM NIGHT</text>
</svg>
