<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>What's for Dinner?</title>
  <link href="style-en.css" rel="stylesheet">
  <!-- Google tag (gtag.js) -->
<script async src="https.googletagmanager.com/gtag/js?id=G-XZZTDMHNDL"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-XZZTDMHNDL');
</script>
</head>
<body>
  <div class="container">
    <div class="lang-switch">
      <a href="index.html">🇰🇷 한국어</a>
    </div>
    <h1>What's for Dinner?</h1>
    <p class="subtitle">Click the button to get a dinner recommendation</p>

    <div id="result" class="result hidden">
      <img id="menu-img" class="menu-img" src="" alt="" />
      <span id="emoji" class="emoji"></span>
      <span id="menu" class="menu-name"></span>
    </div>

    <button id="recommend-btn" class="btn">Recommend Me!</button>

    <div class="category-filter">
      <button class="filter-btn active" data-category="all">All</button>
      <button class="filter-btn" data-category="asian">Asian</button>
      <button class="filter-btn" data-category="western">Western</button>
      <button class="filter-btn" data-category="mexican">Mexican</button>
      <button class="filter-btn" data-category="comfort">Comfort Food</button>
      <button class="filter-btn" data-category="healthy">Healthy</button>
    </div>

    <div id="history" class="history">
      <h3>Recent Picks</h3>
      <ul id="history-list"></ul>
    </div>
  </div>

  <script defer src="main-en.js"></script>
</body>
</html>
