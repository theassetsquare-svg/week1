<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘 저녁 뭐 먹지?</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="lang-switch">
      <a href="en.html">🌐 English</a>
    </div>
    <h1>오늘 저녁 뭐 먹지?</h1>
    <p class="subtitle">버튼을 누르면 저녁 메뉴를 추천해드립니다</p>

    <div id="result" class="result hidden">
      <img id="menu-img" class="menu-img" src="" alt="" />
      <span id="emoji" class="emoji"></span>
      <span id="menu" class="menu-name"></span>
    </div>

    <button id="recommend-btn" class="btn">메뉴 추천받기</button>

    <div class="category-filter">
      <button class="filter-btn active" data-category="all">전체</button>
      <button class="filter-btn" data-category="korean">한식</button>
      <button class="filter-btn" data-category="chinese">중식</button>
      <button class="filter-btn" data-category="japanese">일식</button>
      <button class="filter-btn" data-category="western">양식</button>
      <button class="filter-btn" data-category="snack">분식/간식</button>
    </div>

    <div id="history" class="history">
      <h3>추천 기록</h3>
      <ul id="history-list"></ul>
    </div>
    <div class="contact-form">
      <h2>제휴문의</h2>
      <form action="https://formspree.io/f/mnjvbgba" method="POST">
        <label for="name">이름:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">이메일:</label>
        <input type="email" id="email" name="_replyto" required>

        <label for="message">메시지:</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit" class="btn">보내기</button>
      </form>
    </div>
  </div>

  <script defer src="main.js"></script>
  

</body>
</html>
